<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoMercado Digital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
        <img src="logo.jpeg" alt="EcoMercado Logo" width="30" height="30" class="rounded-circle me-2 bg-white p-1">
        EcoMercado Digital
      </a>
      <div class="d-flex align-items-center text-white">
        <span id="userStatus" class="me-3 badge bg-secondary">Sin sesión</span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm d-none" onclick="logout()">Cerrar Sesión</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">

    <!-- Formulario de Autenticación / Roles -->
    <div id="loginSection" class="row justify-content-center">
      <div class="col-md-5">
        
        <!-- Logo Grande Centrado -->
        <div class="text-center mb-3">
          <img src="logo.jpeg" alt="Logo Grande" class="rounded-circle shadow-sm bg-white p-2" style="width: 130px; height: 130px; object-fit: contain;">
        </div>

        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h3 class="card-title text-center mb-4 text-success fw-bold">Acceso a Plataforma</h3>
            <form onsubmit="handleLogin(event)">
              <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" id="username" class="form-control" placeholder="Nombre de usuario" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Rol de Acceso</label>
                <select id="roleSelect" class="form-select" required>
                  <option value="" disabled selected>Selecciona rol...</option>
                  <option value="Admin">Admin (Control Total)</option>
                  <option value="Productor">Usuario (Productor Cítricos/Frutas)</option>
                  <option value="Comprador">Usuario (Comprador)</option>
                  <option value="Auditor">Auditor (Monitoreo de Logs)</option>
                </select>
              </div>
              <button type="submit" class="btn btn-success w-100 fw-bold">Ingresar</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Panel de Navegación Interactivo -->
    <div id="mainDashboard" class="d-none">

      <!-- Panel Productor: Registro de Cosechas -->
      <div id="productorPanel" class="card shadow-sm mb-4 d-none">
        <div class="card-header bg-success text-white fw-bold">🍋 Registrar Nueva Cosecha</div>
        <div class="card-body">
          <form onsubmit="handleAddProduct(event)" class="row g-3">
            <div class="col-md-4">
              <input type="text" id="prodName" class="form-control" placeholder="Producto (Ej. Limón Criollo)" required>
            </div>
            <div class="col-md-3">
              <input type="number" id="prodPrice" class="form-control" placeholder="Precio ($ por Cien)" step="0.01" required>
            </div>
            <div class="col-md-3">
              <input type="number" id="prodStock" class="form-control" placeholder="Cantidad Disponible" required>
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-primary w-100">Publicar</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Catálogo de Cosechas -->
      <div id="catalogPanel" class="card shadow-sm mb-4 d-none">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
          <span class="fw-bold">📦 Catálogo Centralizado de Cosechas</span>
          <span id="cartCount" class="badge bg-warning text-dark">Pedidos: 0</span>
        </div>
        <div class="card-body">
          <div id="productList" class="row g-3"></div>
        </div>
      </div>

      <!-- Panel Auditor -->
      <div id="auditorPanel" class="card shadow-sm mb-4 d-none">
        <div class="card-header bg-warning text-dark fw-bold">👁️ Panel de Auditoría - Registros de Sistema (Read-Only)</div>
        <div class="card-body">
          <ul id="auditLogs" class="list-group list-group-flush"></ul>
        </div>
      </div>

    </div>

  </div>

  <!-- Vinculación del script JavaScript externo -->
  <script src="app.js"></script>
</body>
</html>
